name: Native iPhone and iPad screenshots
on:
  push:
    branches: [release/store-final-20261028, fix/ios-screenshot-driver-20261028, fix/ipad-navigation-20261029]
    paths:
      - .github/workflows/store-screenshots.yml
      - scripts/store-screenshots-ios.sh
      - .maestro/store-screenshots.yml
      - navigation/AppNavigator.ios.tsx
      - components/NativeTabScroll.ios.tsx
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-store-screenshots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator-build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_PERSONAL_AUTH_STAGE: production
      EXPO_PUBLIC_GOOGLE_LOGIN_ENABLED: 'true'
      MAESTRO_CLI_NO_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked app dependencies
        run: npm ci
      - name: Build the native simulator app once
        run: bash scripts/store-screenshots-ios.sh build
      - name: Save the reusable simulator app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amatora-ios-simulator
          path: artifacts/store-screenshots/amatora-simulator-app.tar.gz
          retention-days: 1
          if-no-files-found: error
      - name: Save native build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amatora-native-build-diagnostics
          path: |
            artifacts/store-screenshots/*.log
            artifacts/store-screenshots/source-commit.txt
          retention-days: 1
          if-no-files-found: error
  native-screenshots:
    needs: simulator-build
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    env:
      MAESTRO_CLI_NO_ANALYTICS: 'true'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
      SCREENSHOT_DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: amatora-ios-simulator
          path: ${{ runner.temp }}/simulator-app
      - name: Capture on a clean simulator worker
        env:
          SIMULATOR_APP_ARCHIVE: ${{ runner.temp }}/simulator-app/amatora-simulator-app.tar.gz
        run: bash scripts/store-screenshots-ios.sh capture
      - name: Save genuine device screenshots and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amatora-store-screenshots-${{ matrix.device }}
          path: artifacts/store-screenshots/
          retention-days: 1
          if-no-files-found: error
