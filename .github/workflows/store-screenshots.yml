name: Native iPhone and iPad screenshots
on:
  push:
    branches: [release/store-final-20261028]
    paths:
      - .github/workflows/store-screenshots.yml
      - scripts/store-screenshots-ios.sh
      - .maestro/store-screenshots.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-store-screenshots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-screenshots:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_PERSONAL_AUTH_STAGE: production
      EXPO_PUBLIC_GOOGLE_LOGIN_ENABLED: 'true'
      MAESTRO_CLI_NO_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked app dependencies
        run: npm ci
      - name: Build native app and capture public pages
        run: bash scripts/store-screenshots-ios.sh
      - name: Save native screenshots and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amatora-native-store-screenshots
          path: artifacts/store-screenshots/
          retention-days: 1
          if-no-files-found: error
